name: Release signed Windows update

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_notes:
        description: Short release note shown in DSH Desktop
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: dsh-desktop-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      DSH_UPDATE_REPOSITORY: ${{ github.repository }}
      DSH_RELEASE_NOTES: ${{ inputs.release_notes }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: |
            package-lock.json
            runtime/package-lock.json

      - name: Install desktop dependencies
        run: npm ci

      - name: Install and verify DSH runtime
        run: npm run runtime:install

      - name: Embed this repository as the update channel
        run: node scripts/configure-release-repository.mjs

      - name: Run update security tests
        run: npm run test:update

      - name: Build MSI and smoke-test packaged runtime
        run: npm run dist:win

      - name: Verify tag matches package version
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne $tag) {
            throw "Tag ${{ github.ref_name }} does not match package version $version."
          }
          "RELEASE_VERSION=$version" >> $env:GITHUB_ENV
          "RELEASE_TAG=$tag" >> $env:GITHUB_ENV

      - name: Create signed update manifest
        env:
          DSH_DESKTOP_UPDATE_PRIVATE_KEY: ${{ secrets.DSH_DESKTOP_UPDATE_PRIVATE_KEY }}
        run: npm run release:manifest

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msi = "release/DSH Desktop-Setup-$env:RELEASE_VERSION.msi"
          gh release view $env:RELEASE_TAG *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $msi release/update.json --clobber
          } else {
            gh release create $env:RELEASE_TAG $msi release/update.json --target $env:GITHUB_SHA --title "DSH Desktop $env:RELEASE_VERSION" --generate-notes
          }
